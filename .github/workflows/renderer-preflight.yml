name: Renderer preflight and build

# Manual-only by design: never execute unreviewed pull-request code on the UE source runner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderer-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renderer-preflight:
    # Register an isolated Windows x64 self-hosted runner with UE 5.7.2 and this custom label.
    runs-on: [self-hosted, Windows, X64, ue-5.7.2]
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Renderer patch and build editor target
        shell: powershell
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File .\Tools\build_with_renderer_preflight.ps1

      - name: Upload preflight reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-preflight-${{ github.run_id }}
          path: Saved/Acceptance/RendererPreflight/UE572/*.json
          if-no-files-found: warn
          retention-days: 14
